name: 'YAML Read'
description: 'This is a NodeJS action to read YAML configuation files.'
inputs:
  config:
    description: 'Config file name'
    required: true
    default: ''
outputs:
  location:
    description: 'The location of the AML workspace'
  namespace:
    description: 'Namespace for the resources'
  postfix:
    description: 'Postfix for the resource names'
  environment:
    description: 'Enviroment of the AML workspace'
  enable_aml_computecluster:
    description: 'Boolean to decide whether to deploy an AML compute cluster or not'
  enable_monitoring:
    description: 'Boolean to decide whether to enable monitoring'
  resource_group:
    description: 'The resource group the AML workspace is in'
  aml_workspace:
    description: 'The AML workspace'
  bep:
    description: 'The batch endpoint name'
  oep:
    description: 'The online endpoint name'
  terraform_version:
    description: 'Terraform version'
  terraform_workingdir:
    description: 'Terraform State working directory'
  terraform_st_location:
    description: 'Terraform State Location'
  terraform_st_resource_group:
    description: 'Terraform State Resource Group'
  terraform_st_storage_account:
    description: "Terraform State Storage Account"
  terraform_st_container_name:
    description: "Terraform State Container name"
  terraform_st_key:
    description: 'Terraform State Key'
  enable_vnet:
    description: 'Boolean to enable VNet + private endpoints (network isolation)'
  vnet_address_prefix:
    description: 'Address prefix for the virtual network'
  default_subnet_prefix:
    description: 'Address prefix for the default subnet'
  compute_subnet_prefix:
    description: 'Address prefix for the AML compute subnet'
  pe_subnet_prefix:
    description: 'Address prefix for the private-endpoints subnet'
  enable_container_registry:
    description: 'Boolean to decide whether to deploy an Azure Container Registry'
  aml_compute_sku:
    description: 'VM SKU for the AML compute cluster'
  tag_cost_center:
    description: 'CostCenter tag value'
  tag_managed_by:
    description: 'ManagedBy tag value'
runs:
  using: 'node16'
  main: 'index.js'
