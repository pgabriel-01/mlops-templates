name: Python SDK v2 - online endpoint

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sdk_repository:
        required: true
        type: string
      sdk_ref:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      endpoint_name:
        required: true
        type: string
      deployment_name:
        required: true
        type: string
      model_name:
        required: true
        type: string
      model_version:
        required: true
        type: string
      compute:
        required: true
        type: string
      environment_name:
        description: Required immutable image-only environment name unless mlflow_no_code is true
        required: false
        default: ""
        type: string
      environment_version:
        description: Required immutable image-only environment version unless mlflow_no_code is true
        required: false
        default: ""
        type: string
      mlflow_no_code:
        description: Let Azure ML supply the curated inference environment for an MLflow model
        required: false
        default: false
        type: boolean
      instance_type:
        required: true
        type: string
      request_file:
        required: true
        type: string
      instance_count:
        required: false
        default: 1
        type: number
      traffic_allocation:
        required: false
        default: 100
        type: number
      python_version:
        required: false
        default: "3.11"
        type: string
      runner:
        required: true
        type: string
      tls_ca_key_vault_secret_id:
        description: Full Key Vault secret resource ID containing the PEM CA bundle
        required: true
        type: string
      endpoint_uami_resource_id:
        description: Optional full resource ID for an explicit endpoint UAMI
        required: false
        default: ""
        type: string
    outputs:
      endpoint_name:
        value: ${{ jobs.deploy_test.outputs.endpoint_name }}
      deployment_name:
        value: ${{ jobs.deploy_test.outputs.deployment_name }}
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  deploy_test:
    environment: ${{ inputs.environment }}
    runs-on: ${{ inputs.runner }}
    env:
      AZUREML_CREDENTIAL_MODE: azure-cli
    outputs:
      endpoint_name: ${{ inputs.endpoint_name }}
      deployment_name: ${{ inputs.deployment_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout Python SDK layer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.sdk_repository }}
          ref: ${{ inputs.sdk_ref }}
          path: .mlops-python-sdk
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: .mlops-python-sdk/src/python-sdk-v2/requirements.txt
      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned Python SDK dependencies
        run: python -m pip install --requirement .mlops-python-sdk/src/python-sdk-v2/requirements.txt
      - name: Prepare private endpoint CA bundle
        id: private_ca
        shell: bash
        env:
          TLS_CA_KEY_VAULT_SECRET_ID: ${{ inputs.tls_ca_key_vault_secret_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TLS_CA_KEY_VAULT_SECRET_ID" =~ ^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[^/]+/secrets/[^/]+(/[^/]+)?$ ]]; then
            echo "tls_ca_key_vault_secret_id must be a full Key Vault secret resource ID." >&2
            exit 1
          fi

          echo "::add-mask::$TLS_CA_KEY_VAULT_SECRET_ID"
          umask 077
          ca_bundle_path="$(mktemp "$RUNNER_TEMP/aml-private-ca.XXXXXX.pem")"
          cleanup_failed_fetch() {
            rm -f -- "$ca_bundle_path"
          }
          trap cleanup_failed_fetch EXIT

          if ! az keyvault secret show \
            --id "$TLS_CA_KEY_VAULT_SECRET_ID" \
            --query value \
            --output tsv > "$ca_bundle_path"; then
            echo "Unable to read the private endpoint CA bundle from Key Vault." >&2
            exit 1
          fi
          chmod 600 "$ca_bundle_path"
          if [[ ! -s "$ca_bundle_path" ]]; then
            echo "The private endpoint CA bundle secret is empty." >&2
            exit 1
          fi

          begin_count="$(grep -c -- '-----BEGIN CERTIFICATE-----' "$ca_bundle_path" || true)"
          end_count="$(grep -c -- '-----END CERTIFICATE-----' "$ca_bundle_path" || true)"
          if [[ "$begin_count" -lt 1 || "$begin_count" -ne "$end_count" ]] ||
            ! openssl crl2pkcs7 -nocrl -certfile "$ca_bundle_path" |
              openssl pkcs7 -print_certs -noout > /dev/null; then
            echo "The private endpoint CA bundle secret is not a valid PEM certificate bundle." >&2
            exit 1
          fi

          echo "ca_bundle_path=$ca_bundle_path" >> "$GITHUB_OUTPUT"
          trap - EXIT
      - name: Create or update endpoint
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          ENDPOINT_NAME: ${{ inputs.endpoint_name }}
          COMPUTE: ${{ inputs.compute }}
          ENDPOINT_UAMI_RESOURCE_ID: ${{ inputs.endpoint_uami_resource_id }}
        run: |
          endpoint_identity_args=()
          if [[ -n "$ENDPOINT_UAMI_RESOURCE_ID" ]]; then
            endpoint_identity_args+=(--endpoint_uami_resource_id "$ENDPOINT_UAMI_RESOURCE_ID")
          fi
          python .mlops-python-sdk/src/python-sdk-v2/create_online_endpoint.py \
            --subscription_id "$AZURE_SUBSCRIPTION_ID" \
            --resource_group "$RESOURCE_GROUP" \
            --workspace_name "$WORKSPACE_NAME" \
            --endpoint_name "$ENDPOINT_NAME" \
            --compute "$COMPUTE" \
            "${endpoint_identity_args[@]}"
      - name: Create or update deployment and traffic
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          ENDPOINT_NAME: ${{ inputs.endpoint_name }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          MODEL_NAME: ${{ inputs.model_name }}
          MODEL_VERSION: ${{ inputs.model_version }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          ENVIRONMENT_VERSION: ${{ inputs.environment_version }}
          MLFLOW_NO_CODE: ${{ inputs.mlflow_no_code }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCE_COUNT: ${{ inputs.instance_count }}
          TRAFFIC_ALLOCATION: ${{ inputs.traffic_allocation }}
        run: |
          deployment_mode_args=()
          if [[ "$MLFLOW_NO_CODE" == "true" ]]; then
            deployment_mode_args+=(--mlflow_no_code)
          fi
          if [[ -n "$ENVIRONMENT_NAME" ]]; then
            deployment_mode_args+=(--environment_name "$ENVIRONMENT_NAME")
          fi
          if [[ -n "$ENVIRONMENT_VERSION" ]]; then
            deployment_mode_args+=(--environment_version "$ENVIRONMENT_VERSION")
          fi
          python .mlops-python-sdk/src/python-sdk-v2/create_online_deployment.py \
            --subscription_id "$AZURE_SUBSCRIPTION_ID" \
            --resource_group "$RESOURCE_GROUP" \
            --workspace_name "$WORKSPACE_NAME" \
            --endpoint_name "$ENDPOINT_NAME" \
            --deployment_name "$DEPLOYMENT_NAME" \
            --model_name "$MODEL_NAME" \
            --model_version "$MODEL_VERSION" \
            --instance_type "$INSTANCE_TYPE" \
            --instance_count "$INSTANCE_COUNT" \
            --traffic_allocation "$TRAFFIC_ALLOCATION" \
            "${deployment_mode_args[@]}"
      - name: Invoke endpoint
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          ENDPOINT_NAME: ${{ inputs.endpoint_name }}
          REQUEST_FILE: ${{ inputs.request_file }}
          CA_BUNDLE_PATH: ${{ steps.private_ca.outputs.ca_bundle_path }}
          REQUESTS_CA_BUNDLE: ${{ steps.private_ca.outputs.ca_bundle_path }}
          SSL_CERT_FILE: ${{ steps.private_ca.outputs.ca_bundle_path }}
        run: |
          python .mlops-python-sdk/src/python-sdk-v2/test_online_endpoint.py \
            --subscription_id "$AZURE_SUBSCRIPTION_ID" \
            --resource_group "$RESOURCE_GROUP" \
            --workspace_name "$WORKSPACE_NAME" \
            --endpoint_name "$ENDPOINT_NAME" \
            --request_file "$REQUEST_FILE" \
            --ca_bundle "$CA_BUNDLE_PATH"
      - name: Remove private endpoint CA bundle
        if: ${{ always() }}
        shell: bash
        env:
          CA_BUNDLE_PATH: ${{ steps.private_ca.outputs.ca_bundle_path }}
        run: |
          set -euo pipefail
          if [[ -n "$CA_BUNDLE_PATH" ]]; then
            rm -f -- "$CA_BUNDLE_PATH"
          fi
