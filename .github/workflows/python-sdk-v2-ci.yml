name: Python SDK v2 checks

on:
  pull_request:
    paths:
      - ".github/workflows/python-sdk-v2-*.yml"
      - "src/python-sdk-v2/**"
      - "tests/test_python_sdk_v2.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-sdk-v2-*.yml"
      - "src/python-sdk-v2/**"
      - "tests/test_python_sdk_v2.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/python-sdk-v2/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement src/python-sdk-v2/requirements-dev.txt
      - name: Lint
        run: ruff check src/python-sdk-v2 tests/test_python_sdk_v2.py
      - name: Test
        run: pytest -q tests/test_python_sdk_v2.py
