name: Python SDK v2 - train and register

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment that provides the OIDC trust policy.
        required: true
        type: string
      sdk_repository:
        description: Repository containing this reusable SDK layer.
        required: true
        type: string
      sdk_ref:
        description: Immutable tag or commit SHA of the SDK repository.
        required: true
        type: string
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      job_file:
        required: true
        type: string
      model_name:
        required: true
        type: string
      model_output_name:
        required: false
        default: model
        type: string
      python_version:
        required: false
        default: "3.11"
        type: string
      runner:
        description: GitHub-hosted label or self-hosted runner label.
        required: false
        default: ubuntu-24.04
        type: string
    outputs:
      training_job_name:
        value: ${{ jobs.train_register.outputs.training_job_name }}
      model_name:
        value: ${{ jobs.train_register.outputs.model_name }}
      model_version:
        value: ${{ jobs.train_register.outputs.model_version }}
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  train_register:
    environment: ${{ inputs.environment }}
    runs-on: ${{ inputs.runner }}
    outputs:
      training_job_name: ${{ steps.train.outputs.training_job_name }}
      model_name: ${{ steps.train.outputs.model_name }}
      model_version: ${{ steps.train.outputs.model_version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout Python SDK layer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.sdk_repository }}
          ref: ${{ inputs.sdk_ref }}
          path: .mlops-python-sdk
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: .mlops-python-sdk/src/python-sdk-v2/requirements.txt
      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned Python SDK dependencies
        run: python -m pip install --requirement .mlops-python-sdk/src/python-sdk-v2/requirements.txt
      - name: Train and register model
        id: train
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          JOB_FILE: ${{ inputs.job_file }}
          MODEL_NAME: ${{ inputs.model_name }}
          MODEL_OUTPUT_NAME: ${{ inputs.model_output_name }}
        run: |
          python .mlops-python-sdk/src/python-sdk-v2/train_and_register_model.py \
            --subscription_id "$AZURE_SUBSCRIPTION_ID" \
            --resource_group "$RESOURCE_GROUP" \
            --workspace_name "$WORKSPACE_NAME" \
            --job_file "$JOB_FILE" \
            --model_name "$MODEL_NAME" \
            --model_output_name "$MODEL_OUTPUT_NAME"
