parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: working_directory
    type: string
    default: '$(System.DefaultWorkingDirectory)'

steps:
  - task: AzureCLI@2
    displayName: Connect to AML Workspace using CLI v2
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: ${{ parameters.working_directory }}
      inlineScript: |
        set -euo pipefail
        az configure --defaults group="$RESOURCE_GROUP" workspace="$WORKSPACE_NAME"
        az ml workspace show \
          --resource-group "$RESOURCE_GROUP" \
          --name "$WORKSPACE_NAME" \
          --output none

        SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
        echo "##vso[task.setvariable variable=subscription_id]$SUBSCRIPTION_ID"
    env:
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}
