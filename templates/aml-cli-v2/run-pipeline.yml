parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: working_directory
    type: string
    default: '$(System.DefaultWorkingDirectory)'
  - name: pipeline_file
    type: string
  - name: experiment_name
    type: string
  - name: display_name
    type: string
  - name: enable_monitoring
    type: string
    default: 'false'

steps:
  - task: AzureCLI@2
    name: trainingJob
    displayName: Run Azure ML pipeline
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      workingDirectory: ${{ parameters.working_directory }}
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        run_id="$(az ml job create \
          --file "$PIPELINE_FILE" \
          --set "experiment_name=$EXPERIMENT_NAME" \
          --set "display_name=$DISPLAY_NAME" \
          --set "inputs.enable_monitoring=$ENABLE_MONITORING" \
          --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" \
          --query name \
          --output tsv)"

        test -n "$run_id"
        echo "##vso[task.setvariable variable=job_id;isOutput=true]$run_id"
        status="$(az ml job show \
          --name "$run_id" \
          --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" \
          --query status \
          --output tsv)"
        running=("NotStarted" "Queued" "Starting" "Preparing" "Running" "Finalizing" "CancelRequested")
        while [[ ${running[*]} =~ $status ]]
        do
          sleep 15
          status="$(az ml job show \
            --name "$run_id" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --query status \
            --output tsv)"
          echo "$status"
        done

        echo "##vso[task.setvariable variable=job_status;isOutput=true]$status"
        if [[ "$status" != "Completed" ]]; then
          echo "Training job '$run_id' finished with status '$status'." >&2
          exit 1
        fi
    env:
      PIPELINE_FILE: ${{ parameters.pipeline_file }}
      EXPERIMENT_NAME: ${{ parameters.experiment_name }}
      DISPLAY_NAME: ${{ parameters.display_name }}
      ENABLE_MONITORING: ${{ parameters.enable_monitoring }}
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}
