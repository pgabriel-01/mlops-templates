parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: working_directory
    type: string
    default: '$(System.DefaultWorkingDirectory)'
  - name: data_type
    type: string
  - name: data_name
    type: string
  - name: data_file
    type: string

steps:
  - task: AzureCLI@2
    displayName: Register Azure ML data asset
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      workingDirectory: ${{ parameters.working_directory }}
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        export AZURE_STORAGE_AUTH_MODE=login
        az ml data create \
          --file "$DATA_FILE" \
          --name "$DATA_NAME" \
          --type "$DATA_TYPE" \
          --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" \
          --output none
    env:
      DATA_TYPE: ${{ parameters.data_type }}
      DATA_NAME: ${{ parameters.data_name }}
      DATA_FILE: ${{ parameters.data_file }}
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}