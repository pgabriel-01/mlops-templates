# Reusable template: Register or update an AML datastore backed by Azure Blob Storage
# Dynamically queries the workspace's linked storage account and creates/updates the datastore
# using identity-based authentication (managed identity, no access keys)

parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: working_directory
    type: string
    default: '$(System.DefaultWorkingDirectory)'
  - name: datastore_name
    type: string
    default: 'workspaceblobstore'
  - name: container_name
    type: string
    default: ''
  - name: storage_account_override
    type: string
    default: ''

steps:
  - task: AzureCLI@2
    displayName: Register datastore (${{ parameters.datastore_name }})
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      workingDirectory: ${{ parameters.working_directory }}
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        if [ -n "$STORAGE_OVERRIDE" ]; then
          STORAGE_ACCOUNT="$STORAGE_OVERRIDE"
        else
          STORAGE_ID="$(az ml workspace show \
            --name "$WORKSPACE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query storage_account \
            --output tsv)"
          STORAGE_ACCOUNT="${STORAGE_ID##*/}"
        fi

        if [ -z "$CONTAINER_NAME" ]; then
          EXISTING_CONTAINER="$(az ml datastore show \
            --name "$DATASTORE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --query container_name \
            --output tsv 2>/dev/null || true)"
          if [ -n "$EXISTING_CONTAINER" ]; then
            CONTAINER_NAME="$EXISTING_CONTAINER"
          else
            CONTAINER_NAME="azureml-blobstore-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          fi
        fi

        DATASTORE_YAML="$(mktemp "${TMPDIR:-/tmp}/datastore-XXXXXX.yml")"
        trap 'rm -f "$DATASTORE_YAML"' EXIT
        cat > "$DATASTORE_YAML" <<EOF
        \$schema: https://azuremlschemas.azureedge.net/latest/azureBlob.schema.json
        name: $DATASTORE_NAME
        type: azure_blob
        account_name: $STORAGE_ACCOUNT
        container_name: $CONTAINER_NAME
        credentials:
          type: environment
        EOF

        az ml datastore create \
          --file "$DATASTORE_YAML" \
          --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" \
          --output none
    env:
      DATASTORE_NAME: ${{ parameters.datastore_name }}
      CONTAINER_NAME: ${{ parameters.container_name }}
      STORAGE_OVERRIDE: ${{ parameters.storage_account_override }}
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}
