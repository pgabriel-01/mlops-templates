parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: endpoint_name
    type: string
    default: '$(endpoint_name)'
  - name: traffic_allocation
    type: string

steps:
  - task: AzureCLI@2
    displayName: Update traffic allocation
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az ml online-endpoint update \
          --name "$ENDPOINT_NAME" \
          --traffic "$TRAFFIC_ALLOCATION" \
          --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" \
          --output none
    env:
      ENDPOINT_NAME: ${{ parameters.endpoint_name }}
      TRAFFIC_ALLOCATION: ${{ parameters.traffic_allocation }}
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}