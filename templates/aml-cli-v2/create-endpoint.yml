parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: endpoint_type
    type: string
    default: '$(endpoint_type)'
  - name: endpoint_name
    type: string
    default: '$(endpoint_name)'
  - name: endpoint_file
    type: string

steps:
  - task: AzureCLI@2
    displayName: Create online/batch endpoint
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        if az ml "$ENDPOINT_TYPE-endpoint" show \
          --name "$ENDPOINT_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" >/dev/null 2>&1; then
          az ml "$ENDPOINT_TYPE-endpoint" update \
            --name "$ENDPOINT_NAME" \
            --file "$ENDPOINT_FILE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --output none
        else
          az ml "$ENDPOINT_TYPE-endpoint" create \
            --name "$ENDPOINT_NAME" \
            --file "$ENDPOINT_FILE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --output none
        fi
    env:
      ENDPOINT_TYPE: ${{ parameters.endpoint_type }}
      ENDPOINT_NAME: ${{ parameters.endpoint_name }}
      ENDPOINT_FILE: ${{ parameters.endpoint_file }}
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}
