parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: endpoint_type
    type: string
    default: '$(endpoint_type)'
  - name: endpoint_name
    type: string
    default: '$(endpoint_name)'
  - name: working_directory
    type: string
    default: '$(System.DefaultWorkingDirectory)'
  - name: deployment_name
    type: string
  - name: sample_request
    type: string
  - name: request_type
    type: string
steps:
  - task: AzureCLI@2
    displayName: Test deployment
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      workingDirectory: ${{ parameters.working_directory }}
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        if [[ "$ENDPOINT_TYPE" == "online" ]]; then
          az ml online-endpoint invoke \
            --name "$ENDPOINT_NAME" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --request-file "$SAMPLE_REQUEST" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME"
        elif [[ "$ENDPOINT_TYPE" == "batch" ]]; then
          job_name="$(az ml batch-endpoint invoke \
            --name "$ENDPOINT_NAME" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --input "$SAMPLE_REQUEST" \
            --input-type "$REQUEST_TYPE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --query name \
            --output tsv)"
          test -n "$job_name"
          az ml job stream \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME"
          status="$(az ml job show \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --query status \
            --output tsv)"
          [[ "$status" == "Completed" ]]
        else
          echo "Unsupported endpoint type '$ENDPOINT_TYPE'." >&2
          exit 2
        fi
    env:
      ENDPOINT_TYPE: ${{ parameters.endpoint_type }}
      ENDPOINT_NAME: ${{ parameters.endpoint_name }}
      DEPLOYMENT_NAME: ${{ parameters.deployment_name }}
      SAMPLE_REQUEST: ${{ parameters.sample_request }}
      REQUEST_TYPE: ${{ parameters.request_type }}
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}
