parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: cluster_name
    type: string
  - name: size
    type: string
  - name: min_instances
    type: number
  - name: max_instances
    type: number
  - name: cluster_tier
    type: string

steps:
  - task: AzureCLI@2
    displayName: Create compute cluster
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        if az ml compute show \
          --name "$CLUSTER_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" >/dev/null 2>&1; then
          echo "Compute '$CLUSTER_NAME' already exists."
        else
          az ml compute create \
            --name "$CLUSTER_NAME" \
            --type amlcompute \
            --size "$COMPUTE_SIZE" \
            --min-instances "$MIN_INSTANCES" \
            --max-instances "$MAX_INSTANCES" \
            --tier "$CLUSTER_TIER" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --output none
        fi
    env:
      CLUSTER_NAME: ${{ parameters.cluster_name }}
      COMPUTE_SIZE: ${{ parameters.size }}
      MIN_INSTANCES: ${{ parameters.min_instances }}
      MAX_INSTANCES: ${{ parameters.max_instances }}
      CLUSTER_TIER: ${{ parameters.cluster_tier }}
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}
