parameters:
  - name: azure_service_connection
    type: string
    default: '$(ado_service_connection_aml_ws)'
  - name: resource_group
    type: string
    default: '$(resource_group)'
  - name: workspace_name
    type: string
    default: '$(aml_workspace)'
  - name: endpoint_type
    type: string
    default: '$(endpoint_type)'
  - name: endpoint_name
    type: string
    default: '$(endpoint_name)'
  - name: deployment_name
    type: string
  - name: deployment_file
    type: string
  - name: enable_monitoring
    type: string
    default: 'false'

steps:
  - task: AzureCLI@2
    displayName: Create deployment
    inputs:
      azureSubscription: ${{ parameters.azure_service_connection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az ml "$ENDPOINT_TYPE-deployment" create \
          --name "$DEPLOYMENT_NAME" \
          --endpoint-name "$ENDPOINT_NAME" \
          --file "$DEPLOYMENT_FILE" \
          --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" \
          --output none
    env:
      ENDPOINT_TYPE: ${{ parameters.endpoint_type }}
      ENDPOINT_NAME: ${{ parameters.endpoint_name }}
      DEPLOYMENT_NAME: ${{ parameters.deployment_name }}
      DEPLOYMENT_FILE: ${{ parameters.deployment_file }}
      RESOURCE_GROUP: ${{ parameters.resource_group }}
      WORKSPACE_NAME: ${{ parameters.workspace_name }}