parameters:
  - name: azureServiceConnection
    type: string
    default: '$(ado_service_connection_rg)'
  - name: location
    type: string
    default: '$(location)'
  - name: resourceGroup
    type: string
    default: '$(terraform_st_resource_group)'
  - name: storageAccount
    type: string
    default: '$(terraform_st_storage_account)'

steps:
  - task: AzureCLI@2
    displayName: 'Create Storage Account'
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      addSpnToEnvironment: true
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail
        az storage account create \
          --name "$STORAGE_ACCOUNT" \
          --resource-group "$RESOURCE_GROUP" \
          --location "$LOCATION" \
          --sku Standard_LRS \
          --allow-shared-key-access false \
          --output none
    env:
      LOCATION: ${{ parameters.location }}
      RESOURCE_GROUP: ${{ parameters.resourceGroup }}
      STORAGE_ACCOUNT: ${{ parameters.storageAccount }}