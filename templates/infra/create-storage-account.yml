steps:
  - task: AzureCLI@2
    displayName: 'Create Storage Account'
    inputs:
      azureSubscription: '$(ado_service_connection_rg)'
      scriptType: 'bash'
      addSpnToEnvironment: true
      scriptLocation: 'inlineScript'
      inlineScript: |
        # Create storage account with shared key access enabled for Terraform backend
        az storage account create -n $(terraform_st_storage_account) -g $(terraform_st_resource_group) -l $(location) --sku Standard_LRS --allow-shared-key-access true