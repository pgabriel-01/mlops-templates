parameters:
  - name: azureServiceConnection
    type: string
    default: '$(ado_service_connection_rg)'
  - name: workingDirectory
    type: string
    default: '$(System.DefaultWorkingDirectory)/$(terraform_workingdir)'
  - name: location
    type: string
    default: '$(location)'
  - name: prefix
    type: string
    default: '$(namespace)'
  - name: postfix
    type: string
    default: '$(postfix)'
  - name: environment
    type: string
    default: '$(environment)'
  - name: includeProjectMetadata
    type: boolean
    default: false
  - name: projectNumber
    type: string
    default: '001'
  - name: cicdPrincipalObjectId
    type: string
    default: ''
  - name: enableAmlComputeCluster
    type: string
    default: '$(enable_aml_computecluster)'
  - name: amlComputeSku
    type: string
    default: '$(aml_compute_sku)'
  - name: enableMonitoring
    type: string
    default: '$(enable_monitoring)'
  - name: planFile
    type: string
    default: tfplan

steps:
  - task: AzureCLI@2
    displayName: 'Terraform plan'
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      addSpnToEnvironment: true
      workingDirectory: ${{ parameters.workingDirectory }}
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail
        export ARM_USE_OIDC=true
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID
        ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"

        terraform_args=(
          -input=false
          -var "location=$TF_VAR_LOCATION" \
          -var "prefix=$TF_VAR_PREFIX" \
          -var "postfix=$TF_VAR_POSTFIX" \
          -var "environment=$TF_VAR_ENVIRONMENT" \
          -var "enable_aml_computecluster=$TF_VAR_ENABLE_AML_COMPUTE" \
          -var "aml_compute_sku=$TF_VAR_AML_COMPUTE_SKU" \
          -var "enable_monitoring=$TF_VAR_ENABLE_MONITORING" \
          -out="$TF_PLAN_FILE"
        )
        if [[ "$INCLUDE_PROJECT_METADATA" == "true" ]]; then
          : "${TF_VAR_CICD_PRINCIPAL_OBJECT_ID:?cicdPrincipalObjectId is required when includeProjectMetadata is true}"
          terraform_args+=(
            -var "project_number=$TF_VAR_PROJECT_NUMBER"
            -var "cicd_principal_object_id=$TF_VAR_CICD_PRINCIPAL_OBJECT_ID"
          )
        fi
        terraform plan "${terraform_args[@]}"
    env:
      TF_VAR_LOCATION: ${{ parameters.location }}
      TF_VAR_PREFIX: ${{ parameters.prefix }}
      TF_VAR_POSTFIX: ${{ parameters.postfix }}
      TF_VAR_ENVIRONMENT: ${{ parameters.environment }}
      INCLUDE_PROJECT_METADATA: ${{ parameters.includeProjectMetadata }}
      TF_VAR_PROJECT_NUMBER: ${{ parameters.projectNumber }}
      TF_VAR_CICD_PRINCIPAL_OBJECT_ID: ${{ parameters.cicdPrincipalObjectId }}
      TF_VAR_ENABLE_AML_COMPUTE: ${{ parameters.enableAmlComputeCluster }}
      TF_VAR_AML_COMPUTE_SKU: ${{ parameters.amlComputeSku }}
      TF_VAR_ENABLE_MONITORING: ${{ parameters.enableMonitoring }}
      TF_PLAN_FILE: ${{ parameters.planFile }}
