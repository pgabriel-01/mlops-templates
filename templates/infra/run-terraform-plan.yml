steps:
  - task: AzureCLI@2
    displayName: 'Terraform plan'
    inputs:
      azureSubscription: '$(ado_service_connection_rg)'
      scriptType: 'bash'
      addSpnToEnvironment: true
      workingDirectory: '$(System.DefaultWorkingDirectory)/$(terraform_workingdir)'
      scriptLocation: 'inlineScript'
      inlineScript: |
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_CLIENT_SECRET=$servicePrincipalKey
        export ARM_TENANT_ID=$tenantId
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        
        terraform plan \
          -var "location=$(location)" \
          -var "prefix=$(namespace)" \
          -var "postfix=$(postfix)" \
          -var "environment=$(environment)" \
          -var "enable_aml_computecluster=$(enable_aml_computecluster)" \
          -var "aml_compute_sku=$(aml_compute_sku)" \
          -var "enable_monitoring=$(enable_monitoring)" \
          -var "client_secret=$ARM_CLIENT_SECRET" \
          -out=tfplan
