parameters:
  - name: azureServiceConnection
    type: string
    default: '$(ado_service_connection_rg)'

steps:
  - task: AzureCLI@2
    displayName: Validate workload identity
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      addSpnToEnvironment: true
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail
        : "${servicePrincipalId:?Service principal ID was not provided by the service connection}"
        : "${tenantId:?Tenant ID was not provided by the service connection}"

        SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
        echo "##vso[task.setvariable variable=SUBSCRIPTION_ID]$SUBSCRIPTION_ID"
        echo "##vso[task.setvariable variable=TENANT_ID]$tenantId"
        echo "##vso[task.setvariable variable=CLIENT_ID]$servicePrincipalId"
        if [[ -n "${idToken:-}" ]]; then
          echo "##vso[task.setvariable variable=ARM_AUTH_MODE]oidc"
        elif [[ -n "${servicePrincipalKey:-}" ]]; then
          echo "##vso[task.setvariable variable=CLIENT_SECRET;issecret=true]$servicePrincipalKey"
          echo "##vso[task.setvariable variable=ARM_AUTH_MODE]client_secret"
        else
          echo "The service connection exposed neither an OIDC token nor a client secret." >&2
          exit 1
        fi