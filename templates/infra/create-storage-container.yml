parameters:
  - name: azureServiceConnection
    type: string
    default: '$(ado_service_connection_rg)'
  - name: storageAccount
    type: string
    default: '$(terraform_st_storage_account)'
  - name: containerName
    type: string
    default: '$(terraform_st_container_name)'

steps:
  - task: AzureCLI@2
    displayName: 'Create Container'
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail
        az storage container create \
          --account-name "$STORAGE_ACCOUNT" \
          --name "$CONTAINER_NAME" \
          --auth-mode login \
          --output none
    env:
      STORAGE_ACCOUNT: ${{ parameters.storageAccount }}
      CONTAINER_NAME: ${{ parameters.containerName }}