parameters:
- name: subscription_id
  type: string
- name: resource_group
  type: string
- name: workspace_name
  type: string
- name: endpoint_name
  type: string
- name: endpoint_description
  type: string
- name: auth_mode
  type: string
- name: compute
  type: string

steps:

- task: AzureCLI@2
  displayName: Creating online endpoint
  inputs:
    azureSubscription: $(ado_service_connection_aml_ws)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      python templates/src/python-sdk-v2/create_online_endpoint.py \
        --subscription_id "${{parameters.subscription_id}}" \
        --resource_group "${{parameters.resource_group}}" \
        --workspace_name "${{parameters.workspace_name}}" \
        --endpoint_name "${{parameters.endpoint_name}}" \
        --description "${{parameters.endpoint_description}}" \
        --auth_mode "${{parameters.auth_mode}}" \
        --compute "${{parameters.compute}}" \
